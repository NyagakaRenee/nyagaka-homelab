# SSH hardening drop-in
# Install as /etc/ssh/sshd_config.d/00-hardening.conf
# The "00-" prefix matters: sshd uses the first value it reads for each setting,
# so this file must load before any other drop-in.
#
# Validate, then reload:  sudo sshd -t && sudo systemctl reload ssh

# Key-based authentication only
PasswordAuthentication no
KbdInteractiveAuthentication no

# No direct root login
PermitRootLogin no

# Recommended next: X11Forwarding no (these servers have no GUI)
